# @author AVRG3
# Build real bundles before publishing; GitHub OIDC avoids npm accounts and new secrets.
name: Publish to MCP Registry

on:
  workflow_dispatch:

concurrency:
  group: publish-context-registry
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bundle:
    if: github.ref == 'refs/heads/main'
    name: bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run bundle:mcpb
      - name: Verify the exact archive outside the checkout
        shell: bash
        run: |
          for file in .tmp/mcpb/*.mcpb; do
            npm run verify:mcpb -- "$file"
          done
      - name: Build and check the portable tarball
        if: runner.os == 'Linux'
        run: |
          npm run bundle:context -- .tmp/mcpb
          npm run verify:release -- --package .tmp/mcpb/tiny-context-standalone-0.1.1.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}
          path: .tmp/mcpb/*
          include-hidden-files: true

  publish:
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: artifacts
          merge-multiple: true
      - run: npm ci
      - run: node scripts/prepare-registry.mjs artifacts
      - name: Publish bundles to GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' artifacts/server.json)
          TAG="context-v${VERSION}"
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          **Safety update:** upgrade from 0.1.0. SQL now accepts one read-only query against the supplied table, blocks external file/network access, enforces resource/deadline limits, and protects existing files during CSV export. Document queries can skip mapping and reuse a bounded, freshness-checked parse cache.

          Eight local MCP tools by **AVRG3** for spreadsheet queries, targeted PDF/Office searches, log summaries, diffs, validation and extraction.

          Choose the bundle for your OS: **darwin = macOS**, **win32 = Windows**, **linux = Linux**. Each contains x64/arm64 dependencies and requires Node.js 20+ or a compatible host-provided runtime. Open it in an MCPB-compatible client. The existing no-login npx installation remains in the README for other clients.

          All eight tools are checked against known answers after extracting the actual bundle. These are unsigned bundles; the registry metadata includes their SHA-256 hashes. Dependencies are included, so bundles are larger than the npm-style download.

          Tools have startup and validation costs. Task-level comparisons include both improvements and regressions; no universal savings are promised. Start with the worked examples: https://github.com/Warddamn/tiny-tools/blob/main/QUICKSTART.md
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-runs must not silently replace artifacts already referenced by registry hashes.
            mkdir -p "$RUNNER_TEMP/published"
            gh release download "$TAG" --dir "$RUNNER_TEMP/published"
            for file in artifacts/*; do
              cmp "$file" "$RUNNER_TEMP/published/$(basename "$file")"
            done
          else
            gh release create "$TAG" artifacts/* --target "$GITHUB_SHA" --title "tiny-context ${VERSION} — agent bundles" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
      - name: Verify public tarball with an empty cache
        run: npm run verify:release
      - name: Install the pinned official publisher
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz -o "$RUNNER_TEMP/publisher.tgz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  $RUNNER_TEMP/publisher.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/publisher.tgz" -C "$RUNNER_TEMP" mcp-publisher
      - name: Publish to the official MCP Registry
        working-directory: artifacts
        run: |
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish
      - name: Verify exact registry version and download hashes
        run: node scripts/verify-runtime-registry.mjs artifacts/server.json
