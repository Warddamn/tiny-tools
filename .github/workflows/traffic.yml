# @author AVRG3
# Always save public release counters. Private traffic needs optional TRAFFIC_TOKEN
# with Administration: read. Missing credentials are recorded as not_configured.
name: traffic

on:
  schedule:
    - cron: "23 5 * * *" # daily, 05:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: traffic-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Save release counters and optional private traffic
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: node scripts/snapshot-stats.mjs

      - name: Commit the snapshot to main
        env:
          FILE: ${{ steps.fetch.outputs.file }}
        run: |
          set -euo pipefail
          git config user.name "tiny-tools-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then
            echo "nothing new to commit"
            exit 0
          fi
          git commit -m "stats: download and traffic snapshot $(basename "$FILE" .json) [skip ci]"
          git push origin HEAD:main || { git pull --rebase origin main && git push origin HEAD:main; }
